name: AB-Vision Inspector · tiras y capturas reales

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar motor JS
        run: |
          node --check src/vision-core.js
          node --check src/app.js
          node --check src/strip-core.js
          node --check src/strip-ui.js
          node --test tests/core.test.js tests/strip-core.test.js
      - name: Validar empaquetado HTML completamente portable
        run: |
          python tools_build_portable.py
          git diff --exit-code -- AB-Vision-Inspector-PORTABLE.html
          python - <<'PY'
          from pathlib import Path
          html=Path('AB-Vision-Inspector-PORTABLE.html').read_text(encoding='utf-8')
          assert 'ABStripCore' in html and 'strip-calibrate' in html
          assert '<script src=' not in html and 'stylesheet' not in html
          print('Portable strip viewer: self-contained PASS')
          PY
      - name: Comprobar servidor cámaras IP
        run: |
          python -m py_compile serve.py
          python -m unittest discover -s tests -p test_ip_camera.py -v
      - name: Verificar adaptador AB-Suite Core
        run: |
          python -m py_compile tools/suite_bridge.py
          python -m unittest discover -s tests -p test_suite_bridge.py -v
      - name: Instalar navegador de pruebas
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Pruebas visuales reales de la aplicación
        run: python -m unittest discover -s tests -p smoke_browser.py -v
      - name: Exportar cuatro capturas verificadas
        uses: actions/upload-artifact@v4
        with:
          name: AB-Vision-Inspector-capturas-reales
          path: docs/screenshots/vision-*.png
          if-no-files-found: error
